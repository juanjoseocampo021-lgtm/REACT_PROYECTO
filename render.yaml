services:
  # BACKEND - API FastAPI
  - type: web
    name: horizonte-api
    runtime: python
    plan: free
    rootDir: TrimestreReact/backend
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./horizonte_viajes.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: SEPARATE_FRONTEND
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  # FRONTEND - React static site
  - type: web
    name: horizonte-frontend
    runtime: static
    plan: free
    rootDir: TrimestreReact/frontend
    buildCommand: bash build.sh
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
